<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>イラスト地図（公開）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #f7f7f8;
    color: #222;
  }

  header {
    padding: 10px 14px;
    border-bottom: 1px solid #ddd;
    background: #fff;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  button {
    padding: 8px 10px;
    cursor: pointer;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 8px;
    font-size: 14px;
  }

  button:hover {
    background: #f3f4f6;
  }

  .pill {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    border: 1px solid #ddd;
    background: #fff;
  }

  #locationStatus {
    font-size: 13px;
    color: #333;
  }

  #locationStatus[hidden] {
    display: none;
  }

  /* 地図名は表示しない */
  #title {
    display: none;
  }

  /* ---- 現在地表示トグル（アイコンボタン） ---- */
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 999px;
    border: 1px solid #ccc;
    background: #fff;
    color: #9ca3af;
  }

  .icon-btn svg {
    width: 20px;
    height: 20px;
  }

  .icon-btn.is-on {
    background: #1e88e5;
    border-color: #1e88e5;
    color: #fff;
  }

  #map {
    /* JS が applyMapSize() で image_width/height 比に上書きする。
       ローディング中のフォールバックとして viewport 高さを使う。 */
    height: calc(100dvh - 92px);
    min-height: 280px;
    width: 100%;
  }

  /* ---- レイヤー切替ボタン ---- */
  #btnToggleLayer {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 900;
    background: rgba(37, 99, 235, 0.92);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s;
  }
  #btnToggleLayer:hover { background: rgba(29, 78, 216, 0.95); }
  #btnToggleLayer[hidden] { display: none; }

  /* 切り替え中インジケータ */
  #layerIndicator {
    position: fixed;
    top: 52px;
    right: 12px;
    z-index: 900;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 11px;
    pointer-events: none;
  }
  #layerIndicator[hidden] { display: none; }

  /* ---- 地図ローディングオーバーレイ ---- */
  #mapLoadingOverlay {
    position: absolute;
    inset: 0;
    z-index: 9999;
    background: #f7f7f8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #666;
    pointer-events: all;
  }
  #mapLoadingOverlay.hidden { display: none; }
  #mapWrap { position: relative; }

  @media (max-width: 720px) {
    /* イラスト地図を全画面表示。ヘッダーは地図の上に浮かせる */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 950;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-bottom: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      padding: 8px 10px;
    }

    #mapWrap {
      position: fixed;
      inset: 0;
    }

    #map {
      /* JS が applyMapSize() で上書きするため !important で全画面高さを強制 */
      height: 100dvh !important;
      min-height: 0;
    }

    #siteFooter {
      display: none;
    }

    .leaflet-control-zoom {
      margin-top: 10px !important;
    }
  }

  /* ---- Building Guide (bottom sheet) ---- */
  .building-guide {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: #fff;
    border-top: 2px solid #e5e7eb;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.18);
    max-height: 72vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .building-guide[hidden] {
    display: none;
  }

  .building-guide-inner {
    position: relative;
    padding: 44px 16px 24px;
  }

  .building-guide-close {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 20px;
    line-height: 1;
    border: 1px solid #e5e7eb;
    background: #fff;
    cursor: pointer;
    color: #374151;
    padding: 4px 10px;
    border-radius: 8px;
    z-index: 1;
  }

  .building-guide-close:hover {
    background: #f3f4f6;
  }

  /* ---- Building photo with floor hotspots ---- */
  .building-photo-wrap {
    position: relative;
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto 14px;
  }

  .building-photo {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
    object-fit: cover;
  }

  .floor-hotspot {
    position: absolute;
    cursor: pointer;
    background: rgba(37, 99, 235, 0.22);
    border: 2px solid #2563eb;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    color: #1d4ed8;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
    padding: 0;
  }

  .floor-hotspot:hover,
  .floor-hotspot.is-active {
    background: rgba(37, 99, 235, 0.60);
    color: #fff;
    border-color: #1d4ed8;
  }

  /* ---- 既定ビル画像: 階グリッドのオーバーレイ表示 ---- */
  .building-floor-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.97);
    border-radius: 8px;
    padding: 40px 10px 10px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    box-sizing: border-box;
    z-index: 2;
  }

  .building-floor-overlay[hidden] {
    display: none;
  }

  .building-floor-overlay-close {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 18px;
    line-height: 1;
    border: 1px solid #e5e7eb;
    background: #fff;
    cursor: pointer;
    color: #374151;
    padding: 3px 9px;
    border-radius: 8px;
    z-index: 1;
  }

  .building-floor-overlay-close:hover {
    background: #f3f4f6;
  }

  .building-floor-overlay-grid .floor-shop-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
    box-sizing: border-box;
  }

  .building-floor-overlay-grid .floor-shop-card {
    padding: 8px 10px;
    box-sizing: border-box;
  }

  /* ---- Floor shop list ---- */
  .floor-shop-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .floor-shop-card {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px 14px;
    background: #fafafa;
  }

  .shop-summary {
    margin-bottom: 10px;
  }

  .shop-name {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 6px;
  }

  .shop-meta {
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 3px 8px;
    font-size: 13px;
    align-items: start;
    margin-bottom: 2px;
  }

  .shop-label {
    color: #6b7280;
    font-size: 12px;
  }

  .shop-link {
    color: #2563eb;
    text-decoration: none;
  }

  .shop-link:hover {
    text-decoration: underline;
  }

  .shop-muted {
    color: #6b7280;
  }

  .shop-image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 6px;
    margin-top: 10px;
  }

  .shop-image-card img {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #e5e7eb;
  }

  .shop-grid-empty {
    color: #6b7280;
    font-size: 13px;
    padding: 6px 0;
  }

  /* ---- Shop markers ---- */
  .shop-marker-normal,
  .shop-marker-active,
  .shop-marker-dimmed {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .shop-marker-normal {
    width: 28px;
    height: 28px;
    background: #2563eb;
    border: 2px solid #fff;
  }

  .shop-marker-normal::after {
    content: "";
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    transform: rotate(45deg);
  }

  .shop-marker-active {
    width: 36px;
    height: 36px;
    background: #f59e0b;
    border: 2px solid #fff;
    border-radius: 50%;
    transform: none;
    box-shadow: 0 0 0 3px rgba(245,158,11,0.4), 0 2px 8px rgba(0,0,0,0.4);
  }

  .shop-marker-active::after {
    content: "★";
    font-size: 20px;
    color: #fff;
    line-height: 1;
  }

  .shop-marker-dimmed {
    width: 16px;
    height: 16px;
    background: #9ca3af;
    border: 1px solid #fff;
    border-radius: 50%;
    transform: none;
    box-shadow: none;
    opacity: 0.6;
  }

  /* ---- Leaflet popup styles (for future use) ---- */
  .shop-popup {
    min-width: 220px;
    max-width: 280px;
    font-size: 13px;
    line-height: 1.5;
  }
  #siteFooter { padding: 8px 12px; font-size: 11px; color: #666; background: #f2f2f3; border-top: 1px solid #ddd; text-align: center; }
  .osm-credit { margin-top: 8px; font-size: 10px; color: #888; }

  /* ---- 目的地バナー ---- */
  .nav-banner{
    position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 1200;
    display: flex; align-items: center; gap: 10px; max-width: calc(100% - 24px);
    padding: 8px 10px 8px 14px; border-radius: 999px;
    background: rgba(28,44,62,.92); color: #fff; font-size: 13px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .nav-banner[hidden]{ display: none; }
  .nav-banner__text{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-banner__clear{
    flex: none; padding: 4px 10px; border: 0; border-radius: 999px;
    background: rgba(255,255,255,.18); color: #fff; font-size: 12px; cursor: pointer;
  }

  /* ---- 方向通知トースト ---- */
  .nav-toast{
    position: fixed; left: 50%; top: 54px; transform: translateX(-50%); z-index: 1250;
    max-width: calc(100% - 24px); padding: 10px 16px; border-radius: 10px;
    background: rgba(20,20,20,.88); color: #fff; font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(0,0,0,.3); animation: navToastIn .18s ease-out;
  }
  .nav-toast[hidden]{ display: none; }
  @keyframes navToastIn{ from{ opacity: 0; transform: translate(-50%, -6px); } }

  /* ---- 目的地ボタン ---- */
  .dest-btn{
    padding: 7px 14px; border: 1px solid #1e88e5; border-radius: 999px;
    background: #fff; color: #1e88e5; font-size: 13px; cursor: pointer;
  }
  .dest-btn.is-active{ background: #1e88e5; color: #fff; }
  .dest-btn[hidden]{ display: none; }

  /* ---- 現在地 FAB（Leaflet コントロール） ---- */
  .location-fab{
    padding: 7px 12px; border: 1px solid rgba(0,0,0,.2); border-radius: 999px;
    background: #fff; color: #888; font-size: 12px; line-height: 1; cursor: pointer;
    box-shadow: 0 1px 5px rgba(0,0,0,.3);
  }
  .location-fab.is-on{ color: #1e88e5; border-color: #1e88e5; font-weight: 700; }

  /* ---- マーカー展開表示（既存クラスに .is-expanded を足す） ---- */
  .shop-marker-normal.is-expanded,
  .shop-marker-active.is-expanded,
  .shop-marker-dimmed.is-expanded{ overflow: visible; }

  .shop-marker-label{
    position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
    margin-left: 6px; padding: 3px 9px; border-radius: 999px;
    background: rgba(255,255,255,.96); color: #222;
    font-size: 12px; font-weight: 700; white-space: nowrap;
    max-width: 42vw; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 1px 4px rgba(0,0,0,.28); pointer-events: none;
    animation: shopLabelIn .16s ease-out;
  }
  .shop-marker-count{ margin-left: 4px; color: #888; font-weight: 400; font-style: normal; }
  @keyframes shopLabelIn{ from{ opacity: 0; transform: translate(-6px, -50%); } }
</style>
</head>
<body>
<header>
  <div class="top-row">
    <strong id="title">読み込み中…</strong>
    <div class="controls">
      <button id="btnToggleLocation" type="button" class="icon-btn" aria-pressed="false" aria-label="現在地表示: OFF" title="現在地表示: OFF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z" />
          <circle cx="12" cy="10" r="2.5" />
        </svg>
      </button>
      <span id="locationStatus" class="pill" hidden></span>
    </div>
  </div>
</header>

<!-- レイヤー切替ボタン（右上固定、Layer2が存在する場合のみJS側で表示） -->
<button id="btnToggleLayer" hidden>レイヤー切替</button>
<div id="layerIndicator" hidden>切り替え中...</div>

<div id="mapWrap">
  <div id="map"></div>
  <div id="mapLoadingOverlay">地図を読み込み中...</div>
</div>

<!-- Building Guide ボトムシート（デフォルト非表示） -->
<div class="building-guide" id="buildingGuide" hidden>
  <div class="building-guide-inner">
    <button type="button" class="building-guide-close" id="buildingGuideClose" aria-label="閉じる">×</button>
    <button id="btnSetDestination" class="dest-btn" type="button" hidden>ここを目的地に設定</button>
    <div class="building-photo-wrap" id="buildingPhotoWrap"></div>
    <div id="floorShopGrid"></div>
    <div class="osm-credit">店舗情報: © OpenStreetMap contributors (ODbL)</div>
  </div>
</div>

<footer id="siteFooter">
  地図タイル: © OpenStreetMap contributors ・
  店舗情報: © OpenStreetMap contributors (ODbL)
</footer>

<div id="navBanner" class="nav-banner" hidden>
  <span class="nav-banner__text" id="navBannerText"></span>
  <button class="nav-banner__clear" id="navBannerClear" type="button">解除</button>
</div>

<div id="navToast" class="nav-toast" role="status" aria-live="polite" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const PROJECT_ID = {{ project_id }};
</script>
<script src="/static/migrationmaps/public.js"></script>
</body>
</html>
