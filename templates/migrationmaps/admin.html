<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>管理画面：イラスト地図→OSM重ね合わせ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    header { padding: 12px 16px; border-bottom: 1px solid #ddd; display:flex; gap:12px; align-items:center; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; height: calc(100vh - 58px); box-sizing: border-box; }
    .panel { border: 1px solid #ddd; border-radius: 10px; overflow: hidden; display:flex; flex-direction:column; }
    .panel header { border: 0; border-bottom: 1px solid #eee; background:#fafafa; }
    .panel .content { padding: 12px; flex:1; overflow:auto; }
    #imgWrap { position: relative; display:inline-block; border: 1px solid #ccc; border-radius: 8px; overflow:hidden; }
    #imgCanvas { display:block; max-width: 100%; height: auto; cursor: crosshair; }
    #map { height: 100%; min-height: 420px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    input[type="text"] { padding: 8px; width: 260px; }
    button { padding: 8px 10px; cursor:pointer; }
    .log { font-size: 12px; white-space: pre-wrap; background:#0b1020; color:#e7e7e7; padding: 10px; border-radius: 8px; }
    table { width:100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid #eee; padding: 6px; text-align:left; }
    th { background:#fafafa; position: sticky; top: 0; }
    .pill { display:inline-block; padding:2px 8px; border-radius: 999px; font-size: 12px; border:1px solid #ddd; background:#fff; }
    .ok { border-color:#2b8a3e; color:#2b8a3e; }
    .ng { border-color:#b02a37; color:#b02a37; }
  </style>
</head>
<body>
<header>
  <strong>管理画面</strong>
  <span class="pill">中心 + 2点以上（合計3点以上）で保存可能</span>
  <span id="status" class="pill ng">未保存</span>
</header>

<main>
  <section class="panel">
    <header>
      <div class="row">
        <label>地図名 <input id="mapName" type="text" placeholder="例：FukuiSta_駅前イラスト" /></label>
        <input id="fileInput" type="file" accept="image/*" />
        <button id="btnSetCenter">中心を選択</button>
        <button id="btnAddPoint">地点を追加</button>
      </div>
    </header>
    <div class="content">
      <div id="imgWrap">
        <canvas id="imgCanvas"></canvas>
      </div>

      <h3>点の一覧（画像座標↔緯度経度のペア）</h3>
      <table>
        <thead>
          <tr>
            <th>label</th>
            <th>画像(x,y)</th>
            <th>緯度経度</th>
            <th>状態</th>
          </tr>
        </thead>
        <tbody id="pointsTbody"></tbody>
      </table>

      <div class="row" style="margin-top:10px;">
        <button id="btnSave">DBへ保存</button>
        <span id="publicLink"></span>
      </div>

      <h3>ログ</h3>
      <div class="log" id="log"></div>
    </div>
  </section>

  <section class="panel">
    <header>
      <div class="row">
        <span class="pill">OSM上をクリックして緯度経度を割当</span>
        <button id="btnPreviewOverlay">重ね合わせプレビュー</button>
      </div>
    </header>
    <div class="content" style="padding:0;">
      <div id="map"></div>
    </div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/migrationmaps/admin.js"></script>
</body>
</html>
