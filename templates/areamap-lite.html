<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">

  <meta property="og:title" content="AreaMap｜アクセスマップ">
  <meta property="og:description" content="初めての人でも迷わないアクセス案内（駐車場・入口あり）">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://areamap.onrender.com/areamaplite">
  <meta property="og:image" content="https://areamap.onrender.com/static/img/headermap.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AreaMap-Lite｜アクセスマップ">
  <meta name="twitter:description" content="初めての人でも迷わないアクセス案内（駐車場・入口あり）">
  <meta name="twitter:image" content="https://areamap.onrender.com/static/img/headermap.jpg">

  <title>AreaMap-Lite版</title>

  <link rel="stylesheet" href="../static/css/areamap-lite.css">

  <script>
    (() => {
      const p = new URLSearchParams(location.search);
      const mode = p.get("mode") || "page"; // page | embed | ig
      document.documentElement.setAttribute("data-areamap-view", mode);
    })();
  </script>
</head>

<body data-areamap-mode="default">
  <div id="map-wrapper">
    <div class="map-image-container">
      <!-- バッジ（任意：文言は自由に） -->
      <div class="areamap-badge" aria-hidden="true">
        駐車場 / メニュー / ルート
      </div>

      <img
        id="sbody-map-img"
        data-track="map_image_click"
        src="../static/img/areamaplite.png"
        alt="AreaMap（イラスト地図）"
        decoding="async"
        fetchpriority="high"
      >

      <!-- 駐車場 -->
      <button
        type="button"
        class="hotspot hotspot-parking"
        data-track="hotspot_parking_open"
        data-modal-img="../static/img/parking.png"
        data-modal-alt="駐車場案内"
        aria-label="駐車場を表示"
      ></button>

      <!-- メニュー -->
      <button
        type="button"
        class="hotspot hotspot-menu"
        data-track="hotspot_menu_open"
        data-modal-img="../static/img/menu.jpg"
        data-modal-alt="メニュー表"
        aria-label="メニューを表示"
      ></button>

      <!-- CTA（地図上に自然に溶ける“下部パネル”） -->
      <div class="areamap-cta">
        <a
          id="google-map-link"
          data-track="google_map_click"
          href="https://maps.app.goo.gl/gwXR4NJGrMMuMGEh6"
          target="_blank"
          rel="noopener"
          class="btn-route"
        >
          GoogleMapでルートを見る
        </a>
        <div class="cta-sub" aria-hidden="true">タップで外部マップを開きます</div>
      </div>
    </div>
  </div>

  <footer class="areamap-footer"></footer>

  <!-- ✅ モーダル：<dialog>に変更（アクセシビリティ改善） -->
  <dialog id="img-modal" class="img-modal" aria-label="画像プレビュー">
    <div class="img-modal__content" role="document">
      <button class="img-modal__close" type="button" aria-label="閉じる">×</button>
      <div class="img-modal__title" id="img-modal-title"></div>
      <img id="img-modal-target" src="" alt="" loading="lazy" decoding="async">
    </div>
  </dialog>

  <script>
    (function () {
      const dialog = document.getElementById("img-modal");
      const modalImg = document.getElementById("img-modal-target");
      const modalTitle = document.getElementById("img-modal-title");
      const closeBtn = dialog.querySelector(".img-modal__close");
      const hotspots = document.querySelectorAll(".hotspot");

      let lastFocus = null;

      function openModal(src, alt) {
        if (!src) return;
        lastFocus = document.activeElement;

        modalImg.src = src;
        modalImg.alt = alt || "画像";
        modalTitle.textContent = alt || "";

        // showModal が使えない環境も一応ケア
        if (typeof dialog.showModal === "function") {
          dialog.showModal();
        } else {
          dialog.setAttribute("open", "");
        }

        // フォーカス
        closeBtn.focus();
      }

      function closeModal() {
        modalImg.src = "";
        modalImg.alt = "";
        modalTitle.textContent = "";

        if (typeof dialog.close === "function") {
          dialog.close();
        } else {
          dialog.removeAttribute("open");
        }

        if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
      }

      hotspots.forEach((btn) => {
        btn.addEventListener("click", () => {
          const src = btn.getAttribute("data-modal-img");
          const alt = btn.getAttribute("data-modal-alt");
          openModal(src, alt);
        });
      });

      closeBtn.addEventListener("click", closeModal);

      // 背景クリックで閉じる（dialogの外側クリック）
      dialog.addEventListener("click", (e) => {
        const rect = dialog.querySelector(".img-modal__content").getBoundingClientRect();
        const inContent =
          e.clientX >= rect.left && e.clientX <= rect.right &&
          e.clientY >= rect.top && e.clientY <= rect.bottom;
        if (!inContent) closeModal();
      });

      // Esc で閉じる（dialogの標準挙動＋念のため）
      dialog.addEventListener("cancel", (e) => {
        e.preventDefault();
        closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && dialog.hasAttribute("open")) closeModal();
      });
    })();
  </script>

  <!-- ✅ 計測（現状維持：1本化） -->
  <script src="../static/js/areamap_metrics.js"></script>
  <script>
    (function () {
      const tracker = window.AreamapMetrics.createTracker({
        endpoint: "/api/metrics/log"
      });
      tracker.trackPageView("areamap_page_view");
      tracker.bindAutoClicks();
    })();
  </script>
</body>
</html>
